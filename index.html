<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bily's App</title>
<style>
    :root {
        --bg: #0a0c10; --panel: #12151c; --panel2: #1a1f2b; --line: #232a38;
        --text: #d8dde8; --text-dim: #7b8497; --accent: #e6b450; --cursor: #5fb8ff; --danger: #f87171; --ok: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
        background: radial-gradient(circle at top, #1a2436 0%, #0a0c10 100%);
        color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif;
        margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-blue { background: var(--cursor); color: #000; }
    .btn-green { background: var(--ok); color: #000; }
    
    #login-screen { display: flex; flex-direction: column; align-items: center; background: var(--panel); padding: 40px 30px; border-radius: 16px; border: 1px solid var(--line); width: 100%; max-width: 400px; margin-top: 10vh; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #login-screen h1 { color: var(--accent); margin-bottom: 5px; }
    #login-screen p { color: var(--text-dim); margin-bottom: 20px; font-size: 14px; }
    #login-screen input { padding: 14px; font-size: 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); margin-bottom: 20px; width: 100%; outline: none; }

    #app-screen { display: none; flex-direction: column; width: 100%; max-width: 800px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--line); font-size: 14px; font-weight: bold; }
    .top-bar span { color: var(--accent); font-size: 18px; }
    
    .controls { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; justify-content: space-between; }
    .controls select, .controls button { padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-weight: bold; cursor: pointer; }
    .controls select:disabled, .controls button:disabled { opacity: 0.5; cursor: not-allowed; }

    #text-display { 
        background-color: var(--panel); border: 1px solid var(--line); 
        padding: 30px; border-radius: 12px; font-size: 22px; line-height: 1.6; 
        width: 100%; word-wrap: break-word; user-select: none; 
        text-align: center; min-height: 120px; display: block; 
    }
    .char { display: inline-block; position: relative; }
    .char.correct { color: var(--ok); }
    .char.incorrect { color: var(--danger); background: rgba(248, 113, 113, 0.2); border-radius: 3px; }
    .char.current::after { content: ''; position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; background-color: var(--cursor); animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    input#hidden-input { position: absolute; opacity: 0; pointer-events: none; }

    .bottom-stats { margin-top: 20px; display: flex; gap: 15px; width: 100%; font-size: 14px; }
    .stat-box { background-color: var(--panel); padding: 15px; border-radius: 12px; text-align: center; flex: 1; border: 1px solid var(--line); }
    .stat-val { display: block; font-size: 24px; font-weight: bold; color: var(--cursor); margin-top: 5px; }

    #creator-screen { display: none; flex-direction: column; width: 100%; max-width: 800px; }
    .api-panel { background: var(--panel2); border: 1px solid var(--line); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .api-panel input { flex: 1; padding: 12px; background: var(--bg); border: 1px solid var(--line); color: white; border-radius: 8px; min-width: 200px; outline: none; }
    
    .form-panel { background: var(--panel); border: 1px solid var(--line); padding: 25px; border-radius: 16px; }
    label { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; display: block; font-weight: bold; }
    textarea { width: 100%; height: 100px; padding: 15px; background: var(--bg); color: white; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 20px; font-family: inherit; resize: vertical; outline: none; font-size: 15px; }
    select, input[type="file"] { padding: 12px; background: var(--bg); color: white; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 20px; width: 100%; outline: none; font-size: 14px; }
    
    #mediaPreview, #videoPreview { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--line); display: none; }
    
    .output-panel { margin-top: 20px; display: none; }
    .code-box { background: #000; border: 1px solid var(--cursor); padding: 15px; border-radius: 8px; font-family: 'Consolas', monospace; font-size: 13px; white-space: pre-wrap; max-height: 350px; overflow-y: auto; color: var(--ok); margin-bottom: 15px; }
    .action-btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .action-btns button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; min-width: 120px; }
    
    .loading { text-align: center; color: var(--accent); font-weight: bold; display: none; margin-top: 25px; animation: blink 1s infinite; font-size: 16px; }
</style>
</head>
<body>

    <div id="login-screen">
        <h1>Bily's App</h1>
        <p>Typing Master & AI Web Creator</p>
        <input type="text" id="username-input" placeholder="Masukkan Username..." autocomplete="off">
        <button class="btn btn-primary" onclick="login()" style="width: 100%;">MASUK</button>
    </div>

    <div id="app-screen">
        <div class="top-bar">
            <div>User: <span id="display-name">-</span></div>
            <div>Poin: <span id="display-points">0</span></div>
            <div>Level: <span id="display-level">1</span></div>
        </div>

        <div class="controls">
            <select id="level-select" onchange="changeLevel()"></select>
            <button id="claim-btn" class="btn btn-primary" onclick="claimDaily()">Klaim Harian (50 Poin)</button>
        </div>

        <div id="text-display">Ketik apa aja buat mulai...</div>
        <input type="text" id="hidden-input" autocomplete="off">

        <div class="bottom-stats">
            <div class="stat-box"><span id="wpm">0</span>WPM</div>
            <div class="stat-box"><span id="accuracy">100%</span>Akurasi</div>
        </div>

        <button class="btn btn-blue" onclick="openCreator()" style="margin-top: 25px; width: 100%; padding: 16px; font-size: 16px;">🚀 Creator Web</button>
    </div>

    <div id="creator-screen">
        <div class="top-bar" style="margin-bottom: 15px;">
            <button class="btn btn-primary" onclick="closeCreator()" style="padding: 8px 15px;">← Kembali</button>
            <div>Sisa Poin: <span id="creator-points">0</span></div>
        </div>

        <div class="api-panel">
            <input type="password" id="apiKeyInput" placeholder="Groq API Key (gsk_...)">
            <button class="btn btn-primary" onclick="saveApiKey()">Simpan</button>
            <span id="apiStatus" style="font-size: 12px; color: var(--danger); font-weight: bold;">Belum diset</span>
        </div>

        <div class="form-panel">
            <label>Prompt / Perintah Web:</label>
            <textarea id="promptInput" placeholder="Contoh: Bikin web portofolio gue, warnanya item doang."></textarea>
            
            <label>Pilih Tipe Web:</label>
            <select id="webType">
                <option value="Artikel/Blog">Web Artikel / Blog</option>
                <option value="Toko Online / Jualan">Web Jualan (Toko Online)</option>
                <option value="Portofolio">Web Portofolio</option>
                <option value="Custom UI / Landing Page">Web Custom / Landing Page</option>
            </select>

            <label>Upload Foto / Video (Opsional, Max 2MB):</label>
            <input type="file" id="mediaInput" accept="image/*,video/*" onchange="handleMediaUpload(event)">
            <img id="mediaPreview" src="" alt="Preview">
            <video id="videoPreview" controls></video>

            <button class="btn btn-blue" id="generateBtn" onclick="generateWeb()" style="width: 100%; margin-top: 10px; padding: 16px; font-size: 16px;">🚀 GENERATE WEB CODE</button>
        </div>

        <div class="loading" id="loadingText">AI lagi mikir... Sabar ya...</div>

        <div class="output-panel" id="outputPanel">
            <h3 style="color: var(--cursor); margin-bottom: 10px;">Hasil Kode:</h3>
            <div class="code-box" id="codeOutput"></div>
            
            <div class="action-btns">
                <button class="btn btn-primary" onclick="copyCode()">📋 Copy Kode</button>
                <button class="btn btn-blue" onclick="downloadCode()">⬇️ Download HTML</button>
                <button class="btn btn-green" onclick="previewCode()">👁️ Preview Web</button>
            </div>
        </div>
    </div>
<script>

        let user = JSON.parse(localStorage.getItem('bilyAppUser')) || null;
    
    function login() {
        const name = document.getElementById('username-input').value.trim();
        if (!name) return alert("Isi nama dulu, Bily!");

        if (user && user.name === name) {
        } else {
            user = { name: name, points: 0, level: 1, maxLevelUnlocked: 1, lastClaim: 0 };
            saveData();
        }

        document.getElementById('display-name').innerText = user.name;
        document.getElementById('creator-points').innerText = user.points;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        
        generateLevelSelect();
        checkDailyClaim();
        loadNewSentence();
        document.getElementById('hidden-input').focus();
    }

    function saveData() {
        localStorage.setItem('bilyAppUser', JSON.stringify(user));
        document.getElementById('display-points').innerText = user.points;
        document.getElementById('creator-points').innerText = user.points;
        document.getElementById('display-level').innerText = currentLevel;
    }

    const kataDasar = ["aku", "kamu", "dia", "main", "bola", "makan", "tidur", "sekolah", "rumah", "kawan", "kode", "data", "sistem", "jaringan", "hacker", "bot", "virus", "login", "sandi", "layar", "tangan", "kaki", "mata", "hati", "buku", "meja", "kursi", "pintu", "jendela"];
    const kataTeknis = ["python", "javascript", "metatrader", "firewall", "payload", "malware", "ransomware", "exploit", "vulnerability", "database", "encryption", "algorithm", "decryption", "cybersecurity", "kernel"];
    
    let currentLevel = 1;
    let currentText = '';
    let charIndex = 0, startTime = null, errors = 0, totalTyped = 0;

    function generateLevelSelect() {
        const select = document.getElementById('level-select');
        select.innerHTML = '';
        for (let i = 1; i <= 100; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            if (i > user.maxLevelUnlocked) {
                opt.innerText = "🔒 Level " + i;
                opt.disabled = true;
            } else {
                opt.innerText = "Level " + i;
            }
            select.appendChild(opt);
        }
        select.value = currentLevel;
    }

    function changeLevel() {
        const select = document.getElementById('level-select');
        currentLevel = parseInt(select.value);
        if (currentLevel > user.maxLevelUnlocked) {
            alert("Level ini masih terkunci!"); select.value = user.level; return;
        }
        user.level = currentLevel;
        saveData();
        loadNewSentence();
    }

    function generateText(level) {
        let wordCount = 3 + Math.floor(level / 20);
        if (wordCount > 15) wordCount = 15;
        let pool = level < 4 ? kataDasar : kataDasar.concat(kataTeknis);
        let sentence = [];
        for (let i = 0; i < wordCount; i++) {
            let randomWord = pool[Math.floor(Math.random() * pool.length)];
            sentence.push(randomWord);
        }
        let result = sentence.join(" ");
        if (level < 500) { return result; } 
        else {
            result = result.charAt(0).toUpperCase() + result.slice(1);
            const punct = [".", ",", "?", "!"];
            return result + punct[Math.floor(Math.random() * punct.length)];
        }
    }

    function loadNewSentence() {
        currentText = generateText(currentLevel);
        charIndex = 0; errors = 0; totalTyped = 0; startTime = null;
        document.getElementById('wpm').innerText = "0";
        document.getElementById('hidden-input').value = '';
        renderText();
    }

    function renderText() {
        const textDisplay = document.getElementById('text-display');
        textDisplay.innerHTML = '';
        const chars = currentText.split('');
        chars.forEach((char, index) => {
            const span = document.createElement('span');
            span.classList.add('char'); span.innerText = char;
            if (index < charIndex) {
                if (char === document.getElementById('hidden-input').value[index]) span.classList.add('correct');
                else span.classList.add('incorrect');
            } else if (index === charIndex) span.classList.add('current');
            textDisplay.appendChild(span);
        });
    }

    function calculateStats() {
        if (!startTime) return;
        const timeElapsed = (Date.now() - startTime) / 1000 / 60;
        const wordsTyped = totalTyped / 5; 
        const wpm = Math.round(wordsTyped / timeElapsed) || 0;
        const accuracy = Math.round(((totalTyped - errors) / totalTyped) * 100) || 0;
        document.getElementById('wpm').innerText = wpm;
        document.getElementById('accuracy').innerText = accuracy + "%";
    }

    document.body.addEventListener('click', (e) => {
        if(document.getElementById('app-screen').style.display !== 'none' && !e.target.closest('button') && !e.target.closest('input') && !e.target.closest('select')) {
            document.getElementById('hidden-input').focus();
        }
    });
    
    document.getElementById('hidden-input').addEventListener('input', (e) => {
        if (!startTime) startTime = Date.now();
        const typedChar = e.target.value[charIndex];
        const actualChar = currentText[charIndex];
        if (typedChar != null) {
            totalTyped++;
            if (typedChar !== actualChar) errors++;
            charIndex++;
            renderText();
            calculateStats();
            if (charIndex === currentText.length) {
                user.points += 5;
                if (currentLevel >= user.maxLevelUnlocked) user.maxLevelUnlocked = currentLevel + 1;
                currentLevel++; user.level = currentLevel;
                saveData(); generateLevelSelect();
                document.getElementById('text-display').style.borderColor = "var(--ok)";
                setTimeout(() => { 
                    document.getElementById('text-display').style.borderColor = "var(--line)"; 
                    loadNewSentence(); 
                }, 400);
            }
        }
    });

    function checkDailyClaim() {
        const oneDay = 24 * 60 * 60 * 1000;
        const btn = document.getElementById('claim-btn');
        if (Date.now() - user.lastClaim > oneDay) { btn.disabled = false; btn.innerText = "Klaim Harian (50 Poin)"; }
        else { btn.disabled = true; btn.innerText = "Sudah Klaim Hari Ini"; }
    }

    function claimDaily() {
        user.points += 50; user.lastClaim = Date.now(); saveData(); checkDailyClaim(); alert("Berhasil klaim 50 Poin Harian!");
    }

    function openCreator() {
        document.getElementById('app-screen').style.display = 'none';
        document.getElementById('creator-screen').style.display = 'flex';
        document.getElementById('creator-points').innerText = user.points;
    }

    function closeCreator() {
        document.getElementById('creator-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        document.getElementById('hidden-input').focus();
    }

    const apiStatus = document.getElementById('apiStatus');
    const apiKeyInput = document.getElementById('apiKeyInput');

    function checkApiKey() {
        const key = localStorage.getItem('groqApiKey');
        if (key) { apiStatus.innerText = "✅ API Key Siap"; apiStatus.style.color = "var(--ok)"; apiKeyInput.value = key; }
    }

    function saveApiKey() {
        const key = apiKeyInput.value.trim();
        if (!key.startsWith('gsk_')) return alert('Format API Key salah (harus gsk_...)');
        localStorage.setItem('groqApiKey', key); checkApiKey(); alert('API Key disimpan!');
    }
    checkApiKey();

    let uploadedMediaBase64 = "";
    let mediaType = ""; 

    function handleMediaUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
            alert("File kegedean! Maksimal 2MB."); event.target.value = ""; return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
            uploadedMediaBase64 = e.target.result;
            mediaType = file.type.startsWith('video') ? 'video' : 'image';
            if (mediaType === 'image') {
                document.getElementById('mediaPreview').src = uploadedMediaBase64;
                document.getElementById('mediaPreview').style.display = 'block';
                document.getElementById('videoPreview').style.display = 'none';
            } else {
                document.getElementById('videoPreview').src = uploadedMediaBase64;
                document.getElementById('videoPreview').style.display = 'block';
                document.getElementById('mediaPreview').style.display = 'none';
            }
        };
        reader.readAsDataURL(file);
    }

    let generatedHTML = '';

    async function generateWeb() {
        const apiKey = localStorage.getItem('groqApiKey');
        const promptText = document.getElementById('promptInput').value.trim();
        const type = document.getElementById('webType').value;

        if (!apiKey) return alert('Isi API Key Groq dulu!');
        if (!promptText) return alert('Ketik perintahnya dulu!');

        document.getElementById('generateBtn').disabled = true;
        document.getElementById('generateBtn').innerText = "Sedang Diproses...";
        document.getElementById('loadingText').style.display = 'block';
        document.getElementById('outputPanel').style.display = 'none';

        let mediaInstruction = "";
        if (uploadedMediaBase64) {
            if (mediaType === 'image') {
                mediaInstruction = `\nWAJIB: Sisipkan gambar ini di dalam tag <img src="${uploadedMediaBase64}" style="max-width:100%; border-radius:10px;"> di bagian tengah web.`;
            } else {
                mediaInstruction = `\nWAJIB: Sisipkan video ini di dalam tag <video controls src="${uploadedMediaBase64}" style="max-width:100%; border-radius:10px;"></video> di bagian tengah web.`;
            }
        }

        const systemPrompt = `Kamu adalah expert web developer. Buat kode web (HTML, CSS, JS jadi satu file index.html) berdasarkan prompt user. Tipe web: ${type}. 
        ${mediaInstruction}
        ATURAN WAJIB:
        1. Keluarkan HANYA kode HTML utuh. Tanpa blok markdown.
        2. Desain modern, responsif, warna enak dilihat.
        3. Di PALING BAWAH, tambahkan "=== TUTORIAL ===".
        4. Di bawahnya ketik: "Web berhasil dibuat! Tonton video tutorial dari Bily di sini: LINK_VIDEO_TUTORIAL_LU_DISINI".`;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama3-8b-8192", 
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: promptText }],
                    temperature: 0.7
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);

            let aiResponse = data.choices[0].message.content;
            let parts = aiResponse.split("=== TUTORIAL ===");
            generatedHTML = parts[0].replace(/\`\`\`html/g, '').replace(/\`\`\`/g, '').trim(); 
            let tutorialText = parts[1] ? parts[1].trim() : "Gagal memuat tutorial.";

            document.getElementById('codeOutput').innerText = generatedHTML + "\n\n[PESAN AI]:\n" + tutorialText;
            document.getElementById('outputPanel').style.display = 'block';

        } catch (error) {
            alert('Error: ' + error.message);
        } finally {
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('generateBtn').innerText = "🚀 GENERATE WEB CODE";
            document.getElementById('loadingText').style.display = 'none';
        }
    }

    function copyCode() { if(generatedHTML) navigator.clipboard.writeText(generatedHTML).then(() => alert('Kode di-copy!')); }
    function downloadCode() { if(!generatedHTML) return; const blob = new Blob([generatedHTML], {type: 'text/html'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'index.html'; a.click(); }
    function previewCode() { if(!generatedHTML) return; const w = window.open(); w.document.write(generatedHTML); w.document.close(); }

    if (user) { document.getElementById('username-input').value = user.name; }
    document.getElementById('username-input').addEventListener('keypress', function (e) { if (e.key === 'Enter') { login(); } });
</script>
</body>
</html>
